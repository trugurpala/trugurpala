name: Profil hatası
description: Profildeki yanlış, bozuk veya güncelliğini yitirmiş bilgiyi bildirin
title: "[Hata]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Güvenlik açığını burada paylaşmayın. SECURITY.md içindeki özel bildirim yolunu kullanın.
  - type: textarea
    id: problem
    attributes:
      label: Sorun nedir?
      description: Yanlış veya eksik bilgiyi ve nerede görüldüğünü açıklayın.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Nasıl olmalı?
      description: Doğru bilgi veya beklenen bağlantıyı yazın.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Doğrulama kaynağı
      description: Varsa doğru bilgiyi destekleyen herkese açık bağlantıyı ekleyin.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik
      options:
        - label: Bildirim kişisel veya gizli veri içermiyor.
          required: true
